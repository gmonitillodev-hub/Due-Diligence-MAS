[project]
name = "due-diligence-mas"
version = "0.1.0"
description = ""
authors = [
    {name = "Giuseppe Monitillo",email = "Giuseppe.Monitillo@ext.luxottica.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[litellm] (>=1.15.40,<2.0.0)",
    "pydantic (>=2.11.9,<2.13)",
    "crewai-tools (>=1.15.41,<2.0.0)",
    "tavily-python (>=0.8.5,<0.9.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "langchain-apify (>=0.2.0,<0.3.0)",
    "langchain (>=1.5.0,<2.0.0)",
    "langgraph (>=1.2.22,<2.0.0)",
    "langchain-tavily (>=0.2.18,<0.3.0)",
    "langchain-openai (>=1.8.0,<2.0.0)",
    "langsmith (>=0.15.0,<0.16.0)"
]

[project.scripts]
due-diligence = "due_diligence_mas.mas_definition.crewai_fr.flows.due_diligence:main"

[tool.poetry]
packages = [{include = "due_diligence_mas", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
