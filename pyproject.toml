[project]
name = "due-diligence-mas"
version = "0.1.0"
description = ""
authors = [
    {name = "Giuseppe Monitillo",email = "Giuseppe.Monitillo@ext.luxottica.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[litellm] (>=1.15.40,<2.0.0)",
    "pydantic (>=2.11.9,<2.13)",
    "crewai-tools (>=1.15.41,<2.0.0)",
    "tavily-python (>=0.8.5,<0.9.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "langchain-apify (>=0.2.0,<0.3.0)",
    "langchain (>=1.5.0,<2.0.0)",
    "langgraph (>=1.2.22,<2.0.0)",
    "langchain-tavily (>=0.2.18,<0.3.0)",
    "langchain-openai (>=1.8.0,<2.0.0)",
    "langsmith (>=0.15.0,<0.16.0)",
    "langgraph-supervisor (>=0.0.31,<0.0.32)",
    "fastapi (>=0.165.0,<0.166.0)",
    "langgraph-checkpoint-sqlite (>=3.1.3,<4.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "mcp (>=1.30.0,<2)"
]

[project.scripts]
langgraph-server = "due_diligence_mas.api_gateway.due_diligence_langgraph:init_gateway"
crewai-server = "due_diligence_mas.api_gateway.due_diligence_crewai:init_gateway"
task-server = "due_diligence_mas.mcp.task_manager:main"

[tool.poetry]
packages = [{include = "due_diligence_mas", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
